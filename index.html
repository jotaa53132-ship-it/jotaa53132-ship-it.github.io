<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogos y Precios - Diseños para Sublimación</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        @keyframes bounce-subtle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .whatsapp-hover:hover {
            animation: bounce-subtle 0.6s ease infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-emerald-50 via-teal-50 to-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-emerald-500 selection:text-white">

    <!-- Card Widget Container -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 p-8 sm:p-10 text-center relative overflow-hidden transition-all duration-300">
        
        <!-- Top decorative badge -->
        <div class="inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-600 px-3.5 py-1 rounded-full text-xs font-semibold tracking-wide uppercase mb-6 border border-emerald-100">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            Atención Inmediata
        </div>

        <!-- WhatsApp Icon Header -->
        <div class="w-20 h-20 bg-emerald-500 text-white rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-emerald-500/30 text-4xl whatsapp-hover transition-transform duration-300">
            <i class="fa-brands fa-whatsapp"></i>
        </div>

        <!-- Subtitle / Context -->
        <div class="text-xs uppercase font-bold tracking-wider text-emerald-600 mb-2">
            Packs de Diseños para Sublimación
        </div>

        <!-- Main Heading -->
        <h1 class="text-xl sm:text-2xl font-bold text-slate-900 mb-8 leading-snug">
            Escribe al WhatsApp para conocer los catálogos y precios de nuestros packs de diseños
        </h1>

        <!-- Call to Action Button -->
        <a id="whatsapp-btn" href="https://wa.me/573116227868?text=Hola,%20quiero%20conocer%20los%20cat%C3%A1logos%20y%20precios%20de%20los%20packs%20de%20dise%C3%B1os%20de%20sublimaci%C3%B3n" target="_blank" rel="noopener noreferrer" class="w-full bg-[#25D366] hover:bg-[#20ba5a] text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-[#25D366]/30 flex items-center justify-center gap-3 transition-all duration-200 text-base sm:text-lg group">
            <i class="fa-brands fa-whatsapp text-2xl group-hover:scale-110 transition-transform"></i>
            <span>Ir al WhatsApp</span>
        </a>

        <!-- Footer note inside widget -->
        <div class="mt-6 flex items-center justify-center gap-1.5 text-slate-400 text-xs font-medium">
            <i class="fa-solid fa-shield-check text-emerald-500"></i>
            <span>Respuesta rápida y segura</span>
        </div>

    </div>

    <!-- Small footer outside card -->
    <footer class="mt-8 text-center text-slate-400 text-xs">
        <p>© 2026 Sublimación Express. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
